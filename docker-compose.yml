version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ichatworld-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CORS_ORIGIN=*
      - FACULTY_PASSPHRASE=${FACULTY_PASSPHRASE:-faculty123}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.us-central1.nebius.com/v1/}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-iChatWorld <info@ichatworld.xyz>}
      - REDIS_URL=${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
