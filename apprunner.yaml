version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  runtime-version: 20
  command: node server/dist/server.js
  network:
    port: 3001
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3001"
    - name: CORS_ORIGIN
      value: "*"
    - name: FACULTY_PASSPHRASE
      value: "faculty123"
    - name: NEBIUS_BASE_URL
      value: "https://api.tokenfactory.us-central1.nebius.com/v1/"
    - name: NEBIUS_MODEL
      value: "deepseek-ai/DeepSeek-V4-Flash"
    - name: RESEND_FROM_EMAIL
      value: "iChatWorld <info@ichatworld.xyz>"
